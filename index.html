<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JumpBear Shop - ชำระเงินผ่าน QR พร้อมเพย์</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
        <h1 class="text-xl font-bold text-slate-800 mb-1 text-center">🧸 JumpBear Shop</h1>
        <p class="text-xs text-slate-500 mb-4 text-center">สแกน QR หรือคัดลอกเลขบัญชีเพื่อชำระเงิน</p>

        <!-- บัตร QR Code รวมข้อมูลบัญชีในกรอบเดียวกัน (พื้นหลังขาวทั้งหมด) -->
        <div class="bg-white border-2 border-blue-900 rounded-xl overflow-hidden shadow-md mb-5">
            <!-- Header -->
            <div class="bg-blue-900 text-white py-2.5 px-4 text-center">
                <div class="text-[12px] tracking-widest opacity-90 font-semibold">SCAN TO PAY</div>
                <div class="font-extrabold text-sm tracking-wide">สแกนจ่ายผ่านคิวอาร์โค้ด</div>
            </div>
            
            <!-- ส่วนแสดง QR Code -->
            <div class="p-4 text-center bg-white">
                <div class="bg-white p-2 inline-block border rounded-lg shadow-sm mb-2">
                    <img src="https://promptpay.io/1791556798/1.00.png" alt="QR PromptPay" class="w-40 h-40 mx-auto object-contain">
                </div>

                <!-- เลขบัญชีพร้อมปุ่มคัดลอก (เอาพื้นหลังสีเทาออกแล้ว) -->
                <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between p-1">
                    <div class="text-left">
                        <span class="text-[10px] text-slate-400 block">พร้อมเพย์ / เลขบัญชี</span>
                        <span id="accountNumber" class="text-xs font-bold text-slate-800 tracking-wide">179-1-55679-8</span>
                    </div>
                    <button type="button" onclick="copyAccount()" id="copyBtn"
                        class="bg-blue-50 hover:bg-blue-100 text-blue-700 text-[11px] font-semibold px-2.5 py-1 rounded-md border border-blue-200 transition duration-200">
                        คัดลอกเลขบัญชี
                    </button>
                </div>

                <!-- ข้อมูลร้านค้าและยอดชำระ -->
                <div class="flex justify-between items-end border-t border-slate-100 pt-3 mt-1 px-1 text-left">
                    <div>
                        <span class="text-[11px] text-slate-400 block">ชื่อร้านค้า</span>
                        <span class="font-bold text-slate-800 text-xs">JumpBear Shop</span>
                    </div>
                    <div class="text-right">
                        <span class="text-[11px] text-slate-400 block">ยอดชำระ</span>
                        <span class="text-base font-bold text-blue-600">1.00 <span class="text-xs text-slate-500 font-normal">บาท</span></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ฟอร์มกรอกข้อมูลและแนบสลิป -->
        <form id="checkoutForm" class="space-y-3">
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">ชื่อของคุณ (สำหรับบันทึกออร์เดอร์):</label>
                <input type="text" id="customerName" required placeholder="เช่น เอกณกร เกิดพุ่ม" 
                    class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- ช่องยอดเงินซ่อนไว้ ส่งค่า 1.00 ไปหลังบ้าน -->
            <input type="hidden" id="amount" value="1.00">

            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">แนบสลิปการโอนเงิน:</label>
                <input type="file" id="slipFile" accept="image/*" required 
                    class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                ยืนยันการชำระเงินและตรวจสอบสลิป
            </button>
        </form>

        <div id="resultBox" class="mt-4 hidden p-3 rounded-lg text-xs"></div>
    </div>

    <script>
        // ฟังก์ชันคัดลอกเลขบัญชี
        function copyAccount() {
            const accText = document.getElementById('accountNumber').textContent;
            navigator.clipboard.writeText(accText);
            
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.textContent = 'คัดลอกแล้ว!';
            copyBtn.className = 'bg-green-50 text-green-700 text-[11px] font-semibold px-2.5 py-1 rounded-md border border-green-300 transition duration-200';
            
            setTimeout(() => {
                copyBtn.textContent = 'คัดลอกเลขบัญชี';
                copyBtn.className = 'bg-blue-50 hover:bg-blue-100 text-blue-700 text-[11px] font-semibold px-2.5 py-1 rounded-md border border-blue-200 transition duration-200';
            }, 2000);
        }

        const form = document.getElementById('checkoutForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultBox = document.getElementById('resultBox');

        const convertFileToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
            });
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const customerName = document.getElementById('customerName').value;
            const amount = document.getElementById('amount').value;
            const slipFile = document.getElementById('slipFile').files[0];

            if (!slipFile) {
                alert('กรุณาอัปโหลดสลิปโอนเงิน');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังตรวจสอบสลิป...';
            resultBox.classList.add('hidden');

            try {
                const base64Image = await convertFileToBase64(slipFile);

                const response = await fetch('http://localhost:3000/api/checkout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        customer_name: customerName,
                        amount: parseFloat(amount),
                        image_base64: base64Image
                    })
                });

                const data = await response.json();

                resultBox.classList.remove('hidden');
                if (response.ok && data.success) {
                    resultBox.className = 'mt-4 p-3 rounded-lg text-xs bg-green-50 text-green-800 border border-green-200';
                    resultBox.innerHTML = `<strong>✅ ชำระเงินสำเร็จ!</strong><br>${data.message}<br><span class="text-[11px] text-slate-600">รหัสออร์เดอร์: ${data.order.id}</span>`;
                } else {
                    resultBox.className = 'mt-4 p-3 rounded-lg text-xs bg-red-50 text-red-800 border border-red-200';
                    resultBox.innerHTML = `<strong>❌ ตรวจสอบสลิปไม่ผ่าน:</strong><br>${data.message || 'สลิปไม่ถูกต้อง'}`;
                }
            } catch (err) {
                resultBox.classList.remove('hidden');
                resultBox.className = 'mt-4 p-3 rounded-lg text-xs bg-red-50 text-red-800 border border-red-200';
                resultBox.innerHTML = `<strong>❌ เกิดข้อผิดพลาด:</strong><br>${err.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'ยืนยันการชำระเงินและตรวจสอบสลิป';
            }
        });
    </script>
</body>
</html>
